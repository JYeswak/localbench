# kit-gates.yml — CI backstop for the starter-kit's honesty gates.
# Active workflow for the scrubbed public export; keep CI gates here.
#
# Rationale: local pre-commit hooks are advisory by git's design —
# `git commit --no-verify` bypasses them silently, and no hook can prevent
# that. This workflow re-runs every gate where --no-verify cannot reach.
# A locally bypassed gate with green CI is a process violation, not a
# silent pass. (CHECKLIST.md B5)
#
# The readiness gate is expected to be RED until Phase A of the checklist
# completes — that redness is the gate working, not a failure to fix by
# weakening the check.
name: kit-gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Planning-packet readiness (A3)
        run: sh scripts/check-readiness.sh

      - name: Claim discipline — README vs proofs (B6)
        run: sh scripts/check-claim-discipline.sh

      # --- Toolchain gate (Gate 5) ---
      # localbench is stdlib-only Python. Measurements need the Mac and local models, so CI
      # runs structure and the pure-logic unit suite (job `tests`); speed evidence comes from
      # banked receipts.
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check localbench --select E,F,W,I --ignore E501
      - name: Byte-compile
        run: python3 -m compileall -q localbench

  # The full pure-logic discovery runs in macOS Seatbelt: no omp/ollama PATH entries, model ports blocked, and
  # external egress denied while the suite's loopback fixtures remain reachable.
  tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pin Python 3.12
        run: uv python pin 3.12
      - name: Hermetic unit tests
        run: uv run --quiet python scripts/hermetic_suite.py
      - name: Hermetic policy mutation checks
        run: uv run --quiet python scripts/mutate.py tests/hermetic-suite-mutations.json --wait-slot 7200
