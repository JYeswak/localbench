# Overlay for every omp child localbench runs (`omp -p ... --config fixtures/omp/child-config.yml`).
# Consumer: workloads.child_flags (e2e, rel tiers) and `localbench record`.
# Why: the default profile's mnemopi autoRecall/autoRetain wrote each benchmark turn into a per-cwd memory bank
# and injected earlier turns — including earlier WRONG answers — into the next run's system prompt
# (ledger 2026-09-23, receipts/2026-09-23-memory-feedback.md). Memory off keeps each child's prompt a function of
# omp + flags only, and keeps benchmark turns out of the user's memory store.
# Delete when: omp -p gains a flag that disables memory recall/retain for one invocation.
memory:
  backend: off
