[project]
name = "localbench"
version = "0.1.0"
description = "Catch local-LLM speed and quality regressions on your Mac, with A/A-derived goldens."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
[project.urls]
Repository = "https://github.com/JYeswak/localbench"
Issues = "https://github.com/JYeswak/localbench/issues"

[project.scripts]
localbench = "localbench.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localbench"]

[tool.ruff]
line-length = 120
